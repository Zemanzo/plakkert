# Weekly dependency updates. Minor and patch updates come grouped, and
# .github/workflows/dependabot-auto-merge.yml merges them once CI passes. Major updates come one
# per pull request and are left for a person to look at.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait until a version has been out for a week: a compromised release is usually found and
    # pulled within days. Security updates don't wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # A group's pull request only merges when every update in it passes CI, so updates that are
    # more likely to fail get a group of their own and don't hold up the rest. Each update goes in
    # the first group it matches.
    groups:
      # A new Prettier or plugin version can format some files differently, which fails pnpm lint.
      # Run pnpm format on the pull request's branch and push that.
      formatting:
        patterns: [prettier, prettier-plugin-*]
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Has to match the Node version the app runs on (26, in the Dockerfile and CI), so it's
      # updated together with that.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: Update

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: Update
