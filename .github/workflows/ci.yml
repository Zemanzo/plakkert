name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Takes pnpm's version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # The client tests run in a real browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      # Builds the app and serves it on a throwaway database; see e2e/server.js.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Builds the Docker image like .github/workflows/release.yml does, on both platforms it's
  # published for, and checks that it starts and takes its configuration from the environment.
  docker:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t plakkert:test .
      # Read-only, with only /data and /tmp writable, like deploy/compose.yaml runs it.
      - name: Start the image
        run: |
          docker run -d --name plakkert --read-only --tmpfs /tmp \
            -p 127.0.0.1:3016:3016 -v plakkert-data:/data \
            -e ORIGIN=https://notes.example.com \
            -e DATABASE_URL=/data/plakkert.db \
            -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdefghij \
            plakkert:test
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3016/ && exit 0
            sleep 1
          done
          echo 'The app did not start within 30 seconds.' >&2
          exit 1
      - name: Check the running app
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          set -x
          # A page, and the API with its database.
          curl -fsS http://127.0.0.1:3016/ | grep -q '<html'
          test "$(curl -fsS http://127.0.0.1:3016/api/auth/get-session)" = null
          # ORIGIN comes from the environment, not the build: a form from it gets past the CSRF
          # check, one from another site doesn't.
          test "$(status -X POST -H 'Content-Type: text/plain' -H 'Origin: https://elsewhere.example' http://127.0.0.1:3016/api/notes)" = 403
          test "$(status -X POST -H 'Content-Type: text/plain' -H 'Origin: https://notes.example.com' http://127.0.0.1:3016/api/notes)" != 403
          # MCP is off unless MCP=on.
          test "$(status http://127.0.0.1:3016/.well-known/oauth-authorization-server)" = 404
      - if: failure()
        run: docker logs plakkert
