name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates. GitHub then merges the pull request
# once the checks that master requires (the CI jobs) pass, and never if they fail. Needs "Allow
# auto-merge" in the repository settings and those checks required on master: without required
# checks, auto-merge would merge straight away.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
